<!doctype html>
<html lang="en" class="dark-mode">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/portalrinth.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
			<title>Portalrinth</title>

			<link rel="stylesheet" href="/src/assets/stylesheets/global.scss" />
			<style>
				html,
				body,
				#app {
					width: 100%;
					height: 100%;
					margin: 0;
				}
				body {
					background: #22241f;
					color: #f5f5f0;
					font: 600 18px sans-serif;
				}
				.boot-screen {
					display: grid;
					width: 100%;
					height: 100%;
					place-content: center;
					justify-items: center;
					gap: 20px;
				}
				.boot-progress {
					width: 120px;
					height: 3px;
					overflow: hidden;
					background: #45483f;
				}
				.boot-progress::after {
					display: block;
					width: 40%;
					height: 100%;
					background: #b5cc74;
					content: '';
					animation: boot-progress 1.2s ease-in-out infinite alternate;
				}
				.boot-error {
					max-width: 36rem;
					color: #f0a46b;
					font-size: 13px;
					font-weight: 400;
					text-align: center;
				}
				@keyframes boot-progress {
					from { transform: translateX(0); }
					to { transform: translateX(150%); }
				}
			</style>
		</head>

	<body>
		<div id="app">
			<div class="boot-screen" role="status" aria-label="Starting Portalrinth">
				<span>Portalrinth</span>
				<div class="boot-progress"></div>
				<p class="boot-error" hidden></p>
			</div>
		</div>
		<script src="/boot.js"></script>
		<script src="https://tally.so/widgets/embed.js" async></script>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
