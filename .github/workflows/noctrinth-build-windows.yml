name: Noctrinth Windows build

# Builds one Windows x64 installer and leaves it in the run's artifacts.
#
# The release workflows already build Windows, but they do it as a side effect
# of a tagged release: they need the updater signing key, they create a release
# (draft or not), and they run for all three platforms. None of that is wanted
# when the question is simply "what does the current `main` look like on
# Windows", which is what this is for.
#
# Because nothing is signed, the installer cannot update itself and is not
# published anywhere — it is a build to try, not a release. Use
# `noctrinth-release.yml` for anything that ships.
#
# WHAT IS DIFFERENT FROM THE RELEASE BUILD
#   * `tauri.build.conf.json` turns off `createUpdaterArtifacts`, which would
#     otherwise fail the build asking for `TAURI_SIGNING_PRIVATE_KEY`.
#   * No tag, no release, no `latest.json`, no updater branch.
#   * Windows only — the other two platforms cost three times as much runner
#     time and nothing here is platform-specific.
#
# HOW TO RUN IT
#   Push the branch this workflow watches:
#     git checkout -b windows-build main
#     git push origin windows-build
#   or press "Run workflow" on the Actions page.

on:
  push:
    branches: [windows-build]
  workflow_dispatch:

concurrency:
  group: noctrinth-build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # windows-latest is x64, and the only Windows target Tauri produces here.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tauri reads the tag and the commit for the version it stamps into
          # the installer, and a shallow clone leaves it guessing.
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Prepare app-lib environment
        shell: bash
        run: cp packages/app-lib/.env.prod packages/app-lib/.env

      - name: Prepare CurseForge API key
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          # Checked here rather than in an `if:`, because the secrets context is
          # not available in a step condition.
          if [ -z "$CURSEFORGE_API_KEY" ]; then
            echo "::notice::No CurseForge key configured. Importing a CurseForge modpack zip will not work in this build."
            exit 0
          fi
          # The key is read raw from this file by vite.config.ts (bypasses
          # dotenv-expand so bcrypt-style `$` chars survive).
          printf 'VITE_CURSEFORGE_API_KEY=%s\n' "$CURSEFORGE_API_KEY" \
            > apps/app-frontend/.env.local

      - name: Sync versions from the VERSION file
        shell: bash
        run: node scripts/sync-version.mjs

      - name: Install dependencies
        run: pnpm install

      - name: Report the toolchain
        shell: bash
        run: |
          node --version
          pnpm --version
          pnpm --filter @modrinth/app exec tauri --version
          rustc --version

      - name: Build the app frontend
        # The same build `beforeBuildCommand` in tauri.conf.json runs. Done as
        # its own step so that a failure here is distinguishable from a failure
        # in the Tauri build — the two look identical in the run's step list
        # otherwise, and a failed step's log needs an account to read.
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Build the installer
        id: build
        shell: bash
        working-directory: apps/app
        continue-on-error: true
        # `--bundles nsis` is the one target that exists on Windows; the config
        # lists the macOS and Linux ones too, which Tauri skips on its own but
        # not before it has looked for their toolchains.
        #
        # `--features updater` matches the release build. What is different is
        # `tauri.build.conf.json`, which turns off the updater artifacts: with
        # them on, the build stops and asks for a signing key that a build to
        # try has no business having.
        #
        # Everything is written to a file and then echoed, rather than piped
        # through tee: a pipeline hides the command's own exit code behind
        # tee's, and a build that fails with nothing printed looks exactly like
        # one that was killed.
        run: |
          set +e
          pnpm tauri build --features updater --bundles nsis --config src/tauri.build.conf.json \
            > "$GITHUB_WORKSPACE/build.log" 2>&1
          code=$?
          cat "$GITHUB_WORKSPACE/build.log"
          echo "### tauri build exited with $code" >> "$GITHUB_WORKSPACE/build.log"
          exit $code

      - name: Report what the build said
        if: always()
        shell: bash
        run: |
          log="$GITHUB_WORKSPACE/build.log"
          if [ ! -f "$log" ]; then
            echo '::error::The build produced no output at all — it never got as far as running.'
            exit 0
          fi

          {
            echo '### Build output, last 60 lines'
            echo '```'
            tail -n 60 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The same lines go into an annotation as well. The logs of a failed
          # step need an account to read; annotations do not, so this is the
          # only copy of the reason a build to try is visible to anyone but the
          # person who pushed it.
          tail -n 60 "$log" \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' \
            > "$RUNNER_TEMP/build-tail.txt"
          echo "::error title=Installer build failed::$(cat "$RUNNER_TEMP/build-tail.txt")"

      - name: Upload the installer
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Noctrinth-Windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Fail the run if the installer was not built
        if: steps.build.outcome != 'success'
        run: exit 1