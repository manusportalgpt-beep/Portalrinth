distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-bin.zip
# The distribution is about 130MB and comes from a server that is slow to
# answer often enough. Ten seconds to read a chunk of it is not enough on a
# busy runner, and the wrapper gives up on the whole download when it runs
# out - which is a build that fails for no reason of its own.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
